<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login: CAMPUSPASS</title>
  <!-- Google Fonts: Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Neo Brutalism CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar navbar-neo">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span>⚡</span> CAMPUSPASS
      </a>
      <a href="index.html" class="btn-nav-login">
        <i class="bi bi-arrow-left"></i> Kembali ke Beranda
      </a>
    </div>
  </nav>

  <!-- ========== LOGIN SECTION ========== -->
  <main class="login-wrapper">
    <div class="login-card-neo">
      <div class="login-card-header">
        <div class="mb-2">
          <span style="font-size: 2.25rem;">⚡</span>
        </div>
        <h2>Masuk ke CAMPUSPASS</h2>
        <p>Login sebagai panitia untuk mengelola event</p>
      </div>

      <div class="login-card-body">
        <form action="dashboard.html" method="GET">
          <div class="mb-3">
            <label class="form-label-neo" for="email">Alamat Email</label>
            <div class="input-group-neo">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" id="email" class="form-control-neo" placeholder="panitia@kampus.ac.id" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label-neo" for="password">Kata Sandi</label>
            <div class="password-toggle-neo">
              <input type="password" id="password" class="form-control-neo" placeholder="Masukkan kata sandi" required>
              <button type="button" class="toggle-btn-neo" id="btnTogglePassword" aria-label="Tampilkan atau sembunyikan password">
                <i class="bi bi-eye" id="toggleIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-neo w-100">
            <i class="bi bi-box-arrow-in-right"></i> Masuk Sekarang
          </button>
        </form>

        <p class="login-footer-text">
          Belum punya akun panitia? <a href="#">Hubungi Admin Kampus</a>
        </p>
      </div>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer-neo">
    <div class="container">
      <p class="mb-0">CAMPUSPASS &copy; 2026 - Kelompok 4 Praktikum Pemrograman Web</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Password Toggle Script -->
  <script>
    const btnToggle = document.getElementById('btnTogglePassword');
    const inputPassword = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    if (btnToggle && inputPassword && toggleIcon) {
      btnToggle.addEventListener('click', () => {
        const isPassword = inputPassword.getAttribute('type') === 'password';
        inputPassword.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    }
  </script>
</body>
</html>
